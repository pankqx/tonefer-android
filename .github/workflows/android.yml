name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Version
        run: |
          echo "VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          # Version comes from the VERSION file; bump it to start a new release.
          echo "VERSION_NAME=$(cat VERSION | tr -d '[:space:]')" >> "$GITHUB_ENV"

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.TONEFER_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "TONEFER_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Release signing: enabled"
          else
            echo "Release signing: no keystore secret, using debug key"
          fi

      - name: Test and build
        env:
          TONEFER_KEYSTORE_PASSWORD: ${{ secrets.TONEFER_KEYSTORE_PASSWORD }}
          TONEFER_KEY_ALIAS: ${{ secrets.TONEFER_KEY_ALIAS }}
          TONEFER_KEY_PASSWORD: ${{ secrets.TONEFER_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace recordRoborazziDebug assembleRelease

      - name: Collect APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk "tonefer-${VERSION_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk tonefer.apk

      # Screenshots, the APK and test results go to the ci-output branch for review.
      - name: Publish CI output
        if: always() && github.event_name != 'pull_request'
        run: |
          mkdir -p ci-out
          cp -r app/screenshots ci-out/ 2>/dev/null || true
          cp "tonefer-${VERSION_NAME}.apk" ci-out/ 2>/dev/null || true
          cp -r app/build/test-results/testDebugUnitTest ci-out/test-results 2>/dev/null || true
          cd ci-out
          echo "run ${{ github.run_number }} · ${{ github.sha }} · ${{ job.status }}" > STATUS.txt
          git init -q && git checkout -q -b ci-output && git add -A
          git -c user.name=pankqx -c user.email=pankqx@gmail.com commit -qm "CI output for run ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-output

      - uses: actions/upload-artifact@v4
        with:
          name: tonefer-apk
          path: tonefer-*.apk
          if-no-files-found: error

      - name: Unit test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/

      # Every build of main refreshes the release for the current VERSION.
      # Stable download link: https://github.com/<owner>/<repo>/releases/latest/download/tonefer.apk
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: Tonefer for Android ${{ env.VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          body_path: CHANGELOG.md
          make_latest: "true"
          files: |
            tonefer.apk
            tonefer-${{ env.VERSION_NAME }}.apk
